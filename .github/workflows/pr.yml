name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Report runner architecture
        run: echo "$RUNNER_OS $RUNNER_ARCH"
        shell: bash
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node_modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-node_modules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - run: npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium firefox
        working-directory: packages/e2e
      - name: Install Playwright browsers
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox
        working-directory: packages/e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test Chromium lifecycle and Pages latency
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum npm run e2e:headless
          else
            npm run e2e:headless
          fi
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test Chromium Pages latency
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum npm run e2e:headless --workspace=packages/e2e
          else
            npm run e2e:headless --workspace=packages/e2e
          fi
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          THREEJS_DEMO_LATENCY_MS: 150
      - name: Test Firefox scene lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run e2e:headless --workspace=packages/e2e
          else
            npm run e2e:headless --workspace=packages/e2e
          fi
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          THREEJS_DEMO_BROWSER: firefox
      - name: Test Firefox Pages latency
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run e2e:headless --workspace=packages/e2e
          else
            npm run e2e:headless --workspace=packages/e2e
          fi
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          THREEJS_DEMO_BROWSER: firefox
          THREEJS_DEMO_LATENCY_MS: 150
      - name: Upload browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.os }}
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore

  firefox-baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d69d8faf09dced43d327c5a766202e0fb6c5b0a8
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Use identical lifecycle diagnostics on the pre-update runtime
        env:
          DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$DIAGNOSTIC_HEAD:packages/e2e/threejs.static-site.ts" > packages/e2e/threejs.static-site.ts
          git show "$DIAGNOSTIC_HEAD:packages/e2e/firefoxCompilerWarnings.ts" > packages/e2e/firefoxCompilerWarnings.ts
      - run: npm ci
      - run: npm run build
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
        working-directory: packages/e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test baseline Firefox lifecycle
        run: xvfb-run -a npm run e2e:headless --workspace=packages/e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          THREEJS_DEMO_BROWSER: firefox
      - name: Upload baseline browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-baseline-ubuntu-arm
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore
